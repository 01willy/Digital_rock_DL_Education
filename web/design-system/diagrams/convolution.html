<!-- @dsCard group="Diagrams" name="Convolution" subtitle="3×3 커널 윈도우" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Convolution — Digital Rock Design System</title>
<link rel="stylesheet" href="../styles/deck.css" />
<style>
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink)}
  .ds-stage{width:520px;box-sizing:border-box;padding:56px;background:var(--bg);display:flex;flex-direction:column;gap:28px;align-items:stretch}
  
</style>
</head>
<body>
<div class="ds-stage">
<div class="eyebrow">DIAGRAM (SVG)</div><h2 class="s-title sm" style="margin-bottom:10px">Convolution</h2><div class="chart-wrap"><div style="text-align:center"><svg viewBox="0 0 230 230" style="width:230px">
              <g>
                <!-- base grid -->
                <rect x="10" y="10" width="210" height="210" fill="#F4F1EB"/>
                <g stroke="#D8DCE3" stroke-width="1.5" fill="#fff">
                  <!-- 5x5 cells -->
                </g>
                <!-- cells -->
                <g>
                  <!-- draw 25 cells -->
                  <g fill="#EEF1F5" stroke="#D8DCE3" stroke-width="1.5">
                    <rect x="10" y="10" width="42" height="42"/><rect x="52" y="10" width="42" height="42"/><rect x="94" y="10" width="42" height="42"/><rect x="136" y="10" width="42" height="42"/><rect x="178" y="10" width="42" height="42"/>
                    <rect x="10" y="52" width="42" height="42"/><rect x="178" y="52" width="42" height="42"/>
                    <rect x="10" y="94" width="42" height="42"/><rect x="178" y="94" width="42" height="42"/>
                    <rect x="10" y="136" width="42" height="42"/><rect x="178" y="136" width="42" height="42"/>
                    <rect x="10" y="178" width="42" height="42"/><rect x="52" y="178" width="42" height="42"/><rect x="94" y="178" width="42" height="42"/><rect x="136" y="178" width="42" height="42"/><rect x="178" y="178" width="42" height="42"/>
                  </g>
                  <!-- highlighted 3x3 kernel window -->
                  <g fill="#FBE7CE" stroke="#EA851B" stroke-width="2">
                    <rect x="52" y="52" width="42" height="42"/><rect x="94" y="52" width="42" height="42"/><rect x="136" y="52" width="42" height="42"/>
                    <rect x="52" y="94" width="42" height="42"/><rect x="94" y="94" width="42" height="42"/><rect x="136" y="94" width="42" height="42"/>
                    <rect x="52" y="136" width="42" height="42"/><rect x="94" y="136" width="42" height="42"/><rect x="136" y="136" width="42" height="42"/>
                  </g>
                </g>
              </g>
            </svg></div></div>
</div>
</body>
</html>
