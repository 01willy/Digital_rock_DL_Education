<!-- @dsCard group="Slide frames" name="Content slide" subtitle="eyebrow · title · two-col body" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content slide — Digital Rock Design System</title>
<link rel="stylesheet" href="../styles/deck.css" />
<style>
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink)}
  .ds-stage{position:relative;width:1920px;height:1080px;background:var(--bg);overflow:hidden}.ds-stage.dark{background:var(--navy);color:#fff}
  
</style>
</head>
<body>
<div class="ds-stage">

  <div class="s-pad">
    <div class="eyebrow">SECTION LABEL</div>
    <h2 class="s-title sm">콘텐츠 슬라이드 레이아웃</h2>
    <p class="s-sub">eyebrow + 제목 + 부제목 위에 2단 본문(.two)이 오는 표준 틀입니다.</p>
    <div class="body vcenter">
      <div class="two">
        <div class="vcenter blist">
          <div class="bitem"><div class="bi-ic navy">1</div><div><div class="bi-t">왼쪽 항목</div><div class="bi-d">설명 텍스트가 들어갑니다.</div></div></div>
          <div class="bitem"><div class="bi-ic">2</div><div><div class="bi-t">두 번째 항목</div><div class="bi-d">아이콘·제목·설명 구조.</div></div></div>
        </div>
        <div class="dcard tint vcenter" style="justify-content:center">
          <div class="eyebrow navy" style="font-size:18px">오른쪽 카드</div>
          <div class="code" style="margin-top:18px">model = <span class="or">UNetMini</span>(base=<span class="gn">8</span>)</div>
        </div>
      </div>
    </div>
    <div class="foot"><div class="brand">Digital Rock · 예시</div><div class="pg"><b>04</b> / 24</div></div>
  </div>
</div>
</body>
</html>
