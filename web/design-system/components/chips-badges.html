<!-- @dsCard group="Components" name="Chips & badges" subtitle="orange · navy · green · ghost · dark" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chips & badges — Digital Rock Design System</title>
<link rel="stylesheet" href="../styles/deck.css" />
<style>
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink)}
  .ds-stage{width:1040px;box-sizing:border-box;padding:56px;background:var(--bg);display:flex;flex-direction:column;gap:28px;align-items:stretch}
  
</style>
</head>
<body>
<div class="ds-stage">

  <div class="eyebrow">COMPONENT</div><h2 class="s-title sm">Chips &amp; badges</h2>
  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">
    <span class="chip orange"><span class="dot"></span>orange</span>
    <span class="chip navy"><span class="dot"></span>navy</span>
    <span class="chip green"><span class="dot"></span>green</span>
    <span class="chip ghost"><span class="dot"></span>ghost</span>
  </div>
  <div style="background:var(--navy);padding:24px;border-radius:14px;margin-top:8px"><span class="chip dark"><span class="dot"></span>dark (네이비 배경 위)</span></div>
</div>
</body>
</html>
