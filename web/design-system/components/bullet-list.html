<!-- @dsCard group="Components" name="Bullet list" subtitle="blist / bitem (+navy icon)" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bullet list — Digital Rock Design System</title>
<link rel="stylesheet" href="../styles/deck.css" />
<style>
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink)}
  .ds-stage{width:1000px;box-sizing:border-box;padding:56px;background:var(--bg);display:flex;flex-direction:column;gap:28px;align-items:stretch}
  
</style>
</head>
<body>
<div class="ds-stage">

  <div class="eyebrow">COMPONENT</div><h2 class="s-title sm">Bullet list (.blist / .bitem)</h2>
  <div class="blist">
    <div class="bitem"><div class="bi-ic navy">1</div><div><div class="bi-t">네이비 아이콘 항목</div><div class="bi-d">아이콘 + 제목(.bi-t) + 설명(.bi-d).</div></div></div>
    <div class="bitem"><div class="bi-ic">2</div><div><div class="bi-t">주황 아이콘 항목</div><div class="bi-d">기본 아이콘은 주황 틴트.</div></div></div>
    <div class="bitem"><div class="bi-ic navy">σ</div><div><div class="bi-t">기호 아이콘도 가능</div><div class="bi-d">숫자·기호·이모지 모두.</div></div></div>
  </div>
</div>
</body>
</html>
