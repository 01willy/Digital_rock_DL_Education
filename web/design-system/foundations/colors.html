<!DOCTYPE html>
<html lang="ko">
<head>

<title>Color tokens — Digital Rock Design System</title>
<link rel="stylesheet" href="../styles/deck.css" />
<style>
  html,body{margin:0}

</head>
<body>
<div class="ds-stage">
<div class="eyebrow">DESIGN TOKENS</div><h2 class="s-title sm" style="margin:8px 0 24px">Color</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px"><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--navy)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">navy</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#1F3A5F</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--orange)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">orange</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#EA851B</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--orange-600)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">orange-600</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#D4760F</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--orange-200)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">orange-200</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#F6C994</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--green)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">green</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#2E8B57</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--red)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">red</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#C83A3A</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--ink)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">ink</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#1A2333</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--ink-2)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">ink-2</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#5A6475</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--ink-3)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">ink-3</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#8A93A3</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--bg)"></div><div style="padding:12px 14px"><div style="font-family:var(--mono);font-weight:700;font-size:15px">bg</div><div style="font-family:var(--mono);font-size:13px;color:var(--ink-3)">#F4F1EB</div></div></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="height:90px;background:var(--panel)"></div><div style="padding:12px 14px"><div style="font- </html>
